# .github/workflows/production-release.yml
name: Production Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Production AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_2 }}
        run: |
          npx eas-cli build \
            --platform android \
            --profile production \
            --non-interactive \
            --output build.aab

      - name: Submit to Play Store
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_2 }}
        run: |
          npx eas-cli submit \
            --platform android \
            --profile production \
            --non-interactive